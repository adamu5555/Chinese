async function say(...ts){const k=++TK;try{speechSynthesis.cancel();A.pause()}catch(e){}for(const t of ts.filter(Boolean)){if(k!=TK)return;await one(t,k);await new Promise(r=>setTimeout(r,250))}}
function tst(k){return new Promise(res=>{let d=0;const f=r=>{if(!d){d=1;clearTimeout(t);A.pause();res(r)}};const t=setTimeout(()=>f('no response'),6000);A.onerror=()=>f('failed');A.onplaying=()=>{clearTimeout(t);setTimeout(()=>f('works'),1800)};A.src=SRC[k][1]('你好，很高兴认识你');A.play().catch(()=>f('failed'))})}
async function testAll(){TK++;BAD={};const o=$('tr');let r='';try{speechSynthesis.cancel()}catch(e){}for(const k in SRC){o.textContent=r+'Testing '+SRC[k][0]+'… (listen)';r+=SRC[k][0]+': '+await tst(k)+'\n'}o.textContent=r+'Pick a source that works, or leave on Auto.'}
function voiceUI(){const c=cv(),srcs=[['auto','Auto (best online voice)'],['polly','Amazon Polly (Zhiyu)'],['baidu','Baidu Mandarin'],['google','Google Mandarin'],['device','This device only']];$('vs').innerHTML=`<h3>Voice</h3><label class="mut">Voice source</label><select onchange="P.src=this.value;BAD={};sv();say('你好，我叫小明。')">${srcs.map(([v,n])=>`<option value="${v}"${(P.src||'auto')==v?' selected':''}>${n}</option>`).join('')}</select>`+(V.length?`<label class="mut">Device voice (used if online voices fail)</label><select onchange="P.v=this.value;sv();loadV()">${V.map(v=>`<option value="${v.voiceURI}"${v==c?' selected':''}>${v.name} · ${v.lang}</option>`).join('')}</select>`:'')+`<label class="mut">Speed <input type="range" min=".5" max="1.1" step=".05" value="${P.r}" oninput="P.r=+this.value;sv()"></label><button class="spk" onclick="say('你好！很高兴认识你。')">🔊 Test voice</button> <button class="spk" onclick="testAll()">Test each online voice</button><pre id="tr" class="mut" style="white-space:pre-wrap;font:inherit;margin:8px 0"></pre><p class="mut">Last played with: <span class="vn">${LAST||'nothing yet'}</span>. Online voices need an internet connection.</p>`}

function home(){$('d').innerHTML=D.map((l,i)=>{const n=l.w.length,seen=l.w.filter(w=>S[w[0]]).length,due=l.w.filter(w=>S[w[0]]&&S[w[0]].d<=now()).length;
return`<div class="deck"><div><b>${i<5?`Level ${i+1}: `:''}${l.n}</b><span>${l.sub}</span><small>${n?`${n} cards: ${n-seen} new, ${due} due, ${seen} started`:l.err?'Could not load. Check your connection, then tap Study to retry.':'Loading…'}</small><div class="bar"><i style="width:${seen/n*100}%"></i></div></div><button onclick="go(${i})">Study</button></div>`}).join('')+`<p id="cs" class="mut">${CS}</p>`}

let Q=[],cur,shown;
function go(i){if(!D[i].w.length){loadLevel(i).then(()=>D[i].w.length&&go(i));return}const w=D[i].w,t=now();Q=w.filter(x=>S[x[0]]&&S[x[0]].d<=t).concat(w.filter(x=>!S[x[0]]).slice(0,10));view('s');next()}
function next(){cur=Q.shift();if(!cur){$('s').innerHTML=`<div class="card"><div class="hz">🎉</div><p>No more cards due in this deck.</p></div><button class="pri" onclick="view('d')">Back to decks</button>`;return}shown=0;draw()}
function draw(){const[h,p,e]=cur,x=E[h];$('s').innerHTML=`<div class="top"><button class="ghost" onclick="view('d')">← Decks</button><span>${Q.length+1} left</span></div><div class="card"><div class="hz">${h}</div>${shown?`<div class="py">${py(p)}</div><div class="en">${e}</div>`:''}${shown&&x?`<div class="ex"><div class="exz">${x[0].replace(h,`<b class="hl">${h}</b>`)}</div><div class="exp">${py(auto(x[0]).join(' '))}</div><div class="en">${x[1]}</div><button class="spk" onclick="say('${x[0]}')">🔊 Sentence</button></div>`:''}<button class="spk" onclick="say('${h}')">🔊 Listen</button><small class="mut vn">${LAST}</small></div>${shown?`<div class="rt"><button onclick="rate(0)">Again</button><button onclick="rate(1)">Hard</button><button onclick="rate(2)">Good</button><button onclick="rate(3)">Easy</button></div>`:`<button class="pri" onclick="reveal()">Show answer</button>`}`}
function reveal(){shown=1;draw();const x=E[cur[0]];say(cur[0],x&&x[0])}
function rate(q){const s=S[cur[0]]||{i:0,e:2.5};
if(q){s.i=s.i?Math.max(1,Math.round(s.i*[0,1.2,s.e,s.e*1.3][q])):[0,1,1,4][q];s.e=Math.max(1.3,s.e+[0,-.15,0,.15][q]);s.d=now()+s.i*864e5}
else{s.i=0;s.e=Math.max(1.3,s.e-.2);s.d=now()+6e4;Q.push(cur)}
s.u=now();S[cur[0]]=s;save();next()}

function view(v){['d','s','t'].forEach(k=>$(k).hidden=k!=v);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v||(v=='s'&&b.dataset.v=='d')));if(v=='d')home();scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));

const TN=[['M4 6H36','1st tone','high and flat','妈','ma1','mother'],['M4 22L36 6','2nd tone','rising, like "huh?"','麻','ma2','hemp'],['M4 10L14 24L36 4','3rd tone','dips down, then up','马','ma3','horse'],['M4 5L36 25','4th tone','sharp fall, like a command','骂','ma4','scold'],['M14 20H26','Neutral','light and short','吗','ma5','question particle']];
const PR=[['买','mai3','buy'],['卖','mai4','sell'],['十','shi2','ten'],['是','shi4','to be'],['问','wen4','ask'],['吻','wen3','kiss']];
$('t').innerHTML=`<div id="vs"></div><h3>Tones</h3><p class="mut">Tap any row to hear it. The same syllable changes meaning with the tone. Pinyin colors match tones everywhere in the app.</p>`+
TN.map(([d,n,x,h,p,e])=>`<div class="tone" onclick="say('${h}')"><svg class="t${p.slice(-1)}" viewBox="0 0 40 30"><path d="${d}"/></svg><div><b>${n}</b><small>${x}</small></div><div class="r">${h} ${py(p)}<small>${e}</small></div></div>`).join('')+
`<h3>Tone pairs to practise</h3><div class="chips">`+PR.map(([h,p,e])=>`<div class="chip" onclick="say('${h}')">${h} ${py(p)}<small>${e}</small></div>`).join('')+
`</div><h3>Good to know</h3><p class="mut">Two 3rd tones in a row: the first becomes 2nd, so 你好 is said "ní hǎo". Audio uses your device's Chinese voice; if it is silent, add a Chinese voice in your system speech settings.</p><h3>Backup</h3><p class="mut">Tap Show code and copy it to move your progress to another device. To restore, paste a code and tap Restore.</p><textarea id="bk" rows="3"></textarea><div class="rt" style="grid-template-columns:1fr 1fr"><button onclick="$('bk').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('bk').select()">Show code</button><button onclick="restore()">Restore</button></div>`;
function restore(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('bk').value.trim()))));for(const k in o)if(!S[k]||(o[k].u||0)>(S[k].u||0))S[k]=o[k];save();view('d');cs('Progress restored')}catch(e){$('bk').value='That code is not valid.'}}
try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
loadV();view('d');D.forEach((l,i)=>l.lv&&loadLevel(i));
</script></body></html>
